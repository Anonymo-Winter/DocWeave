# Local development stack.
#   With the bundled MongoDB:   docker compose --profile db up --build
#   With your own MongoDB:      set DOCKER_MONGO_URL in a root .env, then: docker compose up --build

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    env_file: ./backend/.env
    environment:
      MONGO_URL: ${DOCKER_MONGO_URL:-mongodb://admin:password@mongo:27017/docweave?authSource=admin}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_started
        required: false

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mongo:
    image: mongo:7
    profiles: ["db"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
