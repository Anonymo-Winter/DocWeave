<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0e17;
            --text: #e0e6ed;
            --glow: rgba(0, 255, 136, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent), transparent);
            top: -200px;
            left: -200px;
            animation: float1 15s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #0088ff, transparent);
            bottom: -150px;
            right: -150px;
            animation: float2 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(100px, 100px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-80px, -80px); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        /* Status indicator */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent);
            border-radius: 50px;
            margin-bottom: 3rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideDown 0.8s ease-out;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px var(--glow);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main heading */
        h1 {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 800;
            line-height: 0.95;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideUp 1s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subheading */
        .subtitle {
            font-size: clamp(1.25rem, 3vw, 2rem);
            font-weight: 300;
            color: rgba(224, 230, 237, 0.7);
            margin-bottom: 3rem;
            animation: slideUp 1s ease-out 0.4s both;
        }

        .uptime-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 0.5rem;
        }

        /* Stats grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            max-width: 700px;
            width: 100%;
            margin: 0 auto 3rem;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            font-family: 'Space Mono', monospace;
        }

        .stat-label {
            font-size: 0.875rem;
            color: rgba(224, 230, 237, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        /* Endpoints section */
        .endpoints-section {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 1s ease-out 1s both;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .endpoints-list {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .endpoint-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        .endpoint-item:last-child {
            margin-bottom: 0;
        }

        .endpoint-path {
            color: var(--text);
            flex: 1;
        }

        .endpoint-stats {
            display: flex;
            gap: 1.5rem;
            color: rgba(224, 230, 237, 0.6);
        }

        .endpoint-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .endpoint-stat-value {
            color: var(--accent);
            font-weight: 700;
        }

        .endpoint-stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: rgba(224, 230, 237, 0.4);
            z-index: 10;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Loading state */
        .loading {
            opacity: 0.5;
        }

        /* Scrollbar styling */
        .endpoints-list::-webkit-scrollbar {
            width: 8px;
        }

        .endpoints-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .endpoints-list::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.3);
            border-radius: 4px;
        }

        .endpoints-list::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .status-badge {
                font-size: 0.75rem;
                padding: 0.6rem 1.2rem;
            }

            .stats {
                gap: 1rem;
                grid-template-columns: repeat(2, 1fr);
            }

            .endpoint-stats {
                gap: 1rem;
            }

            .endpoint-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            footer {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main content -->
    <div class="container">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            <span>System Operational</span>
        </div>

        <h1>Backend<br>is Live</h1>
        
        <p class="subtitle">
            All systems running smoothly
            <div class="uptime-text" id="uptimeDuration">Loading...</div>
        </p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="uptimePercent">--</div>
                <div class="stat-label">Uptime</div>
            </div>
            <div class="stat-card">
                <div class="stat-value"><span id="responseTime">--</span>ms</div>
                <div class="stat-label">Avg Response</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="requests">--</div>
                <div class="stat-label">Total Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">--</div>
                <div class="stat-label">Success Rate</div>
            </div>
        </div>

        <div class="endpoints-section">
            <h2 class="section-title">Active Endpoints</h2>
            <div class="endpoints-list" id="endpointsList">
                <div style="text-align: center; color: rgba(224, 230, 237, 0.4); padding: 2rem;">
                    Loading endpoints...
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-item">
            <span>🕐</span>
            <span id="timestamp"></span>
        </div>
        <div class="footer-item">
            <span>📡</span>
            <span id="connectionStatus">Connected</span>
        </div>
    </footer>

    <script>
        let metricsData = null;

        // Fetch metrics from API
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics');
                if (!response.ok) throw new Error('Failed to fetch metrics');
                metricsData = await response.json();
                updateUI();
                document.getElementById('connectionStatus').textContent = 'Connected';
            } catch (error) {
                console.error('Error fetching metrics:', error);
                document.getElementById('connectionStatus').textContent = 'Disconnected';
            }
        }

        // Update UI with metrics data
        function updateUI() {
            if (!metricsData) return;

            // Update uptime
            document.getElementById('uptimePercent').textContent = 
                `${metricsData.uptime.percentage}%`;
            document.getElementById('uptimeDuration').textContent = 
                `Running for ${metricsData.uptime.duration}`;

            // Update response time
            document.getElementById('responseTime').textContent = 
                metricsData.requests.averageResponseTime || '0';

            // Update request count
            document.getElementById('requests').textContent = 
                metricsData.requests.total.toLocaleString();

            // Calculate success rate
            const statusCodes = metricsData.requests.statusCodes;
            const total = Object.values(statusCodes).reduce((a, b) => a + b, 0);
            const successful = statusCodes['2xx'] + statusCodes['3xx'];
            const successRate = total > 0 ? Math.round((successful / total) * 100) : 100;
            document.getElementById('successRate').textContent = `${successRate}%`;

            // Update endpoints list
            updateEndpointsList();
        }

        // Update endpoints list
        function updateEndpointsList() {
            if (!metricsData || !metricsData.endpoints) return;

            const endpointsList = document.getElementById('endpointsList');
            
            if (metricsData.endpoints.length === 0) {
                endpointsList.innerHTML = `
                    <div style="text-align: center; color: rgba(224, 230, 237, 0.4); padding: 2rem;">
                        No endpoints accessed yet
                    </div>
                `;
                return;
            }

            endpointsList.innerHTML = metricsData.endpoints
                .slice(0, 10) // Show top 10
                .map(endpoint => `
                    <div class="endpoint-item">
                        <div class="endpoint-path">${endpoint.endpoint}</div>
                        <div class="endpoint-stats">
                            <div class="endpoint-stat">
                                <span class="endpoint-stat-value">${endpoint.count}</span>
                                <span class="endpoint-stat-label">Hits</span>
                            </div>
                            <div class="endpoint-stat">
                                <span class="endpoint-stat-value">${endpoint.averageResponseTime}ms</span>
                                <span class="endpoint-stat-label">Avg Time</span>
                            </div>
                        </div>
                    </div>
                `).join('');
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = now.toLocaleString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        // Initialize
        fetchMetrics();
        updateTimestamp();

        // Refresh metrics every 3 seconds
        setInterval(fetchMetrics, 3000);
        
        // Update timestamp every second
        setInterval(updateTimestamp, 1000);
    </script>
</body>
</html>
